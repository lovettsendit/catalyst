<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Two lanes, one engine, one verifier</title>
  <desc id="wf-desc">An expression in Catalyst's own language and a program compiled to LLVM IR by your own compiler both flow into one intermediate representation, which is optimised, analysed and differentiated. The derivative then passes Catalyst's finite-difference verifier. What agrees is written as a JSON answer, a Go or R export, or a derivative artifact with a digest chain. What disagrees is refused and nothing is written.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D7F5C9"/>
    </marker>
    <marker id="wf-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F5C453"/>
    </marker>
  </defs>

  <rect width="1200" height="1000" rx="18" fill="#136207"/>
  <rect x="36" y="50" width="340" height="166" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
  <text class="mono" x="60" y="84" font-size="20" fill="#A8C6A0">expression ·</text>
  <text class="mono" x="60" y="114" font-size="20" fill="#A8C6A0">catalyst.problem.v1</text>
  <text class="mono" x="60" y="156" font-size="22" fill="#D7F5C9">func spring(k, c) =</text>
  <text class="mono" x="60" y="186" font-size="22" fill="#D7F5C9">8 / c + 100 * exp(…)</text>
  <rect x="36" y="330" width="340" height="166" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
  <text class="mono" x="60" y="364" font-size="20" fill="#A8C6A0">program ·</text>
  <text class="mono" x="60" y="394" font-size="20" fill="#A8C6A0">your own compiler</text>
  <text class="mono" x="60" y="436" font-size="20" fill="#D7F5C9">drag.rs  drag.c  drag.cpp</text>
  <text class="mono" x="60" y="466" font-size="20" fill="#D7F5C9">rustc / clang → drag.ll</text>
  <path d="M376 133 C450 133 440 238 480 238" fill="none" stroke="#D7F5C9" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <path d="M376 413 C440 413 435 300 480 282" fill="none" stroke="#D7F5C9" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <text class="mono" x="36" y="540" font-size="20" fill="#A8C6A0">Catalyst Gradient</text>
  <text class="mono" x="36" y="570" font-size="20" fill="#A8C6A0">Compiler reads the IR</text>
  <circle cx="590" cy="260" r="112" fill="#0B4A04" stroke="#F2F7F0" stroke-width="2.5"/>
  <circle cx="590" cy="260" r="98" fill="none" stroke="#A8C6A0" stroke-width="1" stroke-dasharray="3 5"/>
  <text class="sans" x="590" y="234" font-size="28" fill="#F2F7F0" text-anchor="middle" font-weight="700">Catalyst IR</text>
  <text class="mono" x="590" y="258" font-size="20" fill="#D7F5C9" text-anchor="middle">optimise</text>
  <text class="mono" x="590" y="288" font-size="20" fill="#D7F5C9" text-anchor="middle">analyse</text>
  <text class="mono" x="590" y="318" font-size="20" fill="#D7F5C9" text-anchor="middle">differentiate</text>
  <text class="mono" x="780" y="216" font-size="20" fill="#A8C6A0">reverse mode,</text>
  <text class="mono" x="780" y="246" font-size="20" fill="#A8C6A0">or forward for a loop</text>
  <text class="mono" x="780" y="276" font-size="20" fill="#A8C6A0">the mode is recorded</text>
  <path d="M590 372 V522" fill="none" stroke="#D7F5C9" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <text class="mono" x="612" y="448" font-size="20" fill="#A8C6A0">derivative</text>
  <circle cx="590" cy="644" r="122" fill="#0B4A04" stroke="#F2F7F0" stroke-width="2.5"/>
  <circle cx="590" cy="644" r="108" fill="none" stroke="#F2F7F0" stroke-width="1.5"/>
  <text class="sans" x="590" y="602" font-size="28" fill="#F2F7F0" text-anchor="middle" font-weight="700">verifier</text>
  <text class="mono" x="590" y="632" font-size="20" fill="#D7F5C9" text-anchor="middle">finite</text>
  <text class="mono" x="590" y="662" font-size="20" fill="#D7F5C9" text-anchor="middle">differences</text>
  <text class="mono" x="590" y="692" font-size="20" fill="#D7F5C9" text-anchor="middle">over the primal</text>
  <text class="mono" x="36" y="638" font-size="20" fill="#A8C6A0">owes the differentiator</text>
  <text class="mono" x="36" y="668" font-size="20" fill="#A8C6A0">nothing:</text>
  <text class="mono" x="36" y="698" font-size="20" fill="#A8C6A0">the derivative transform</text>
  <text class="mono" x="36" y="728" font-size="20" fill="#A8C6A0">is not in its path</text>
  <path d="M712 644 C768 644 764 468 800 468" fill="none" stroke="#D7F5C9" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <rect x="800" y="394" width="370" height="148" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
  <path d="M712 644 C768 644 764 660 800 660" fill="none" stroke="#D7F5C9" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <rect x="800" y="586" width="370" height="148" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
  <path d="M712 644 C768 644 764 852 800 852" fill="none" stroke="#D7F5C9" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <rect x="800" y="778" width="370" height="148" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
  <text class="sans" x="822" y="426" font-size="26" fill="#F2F7F0" font-weight="700">value and gradient</text>
  <text class="mono" x="822" y="460" font-size="20" fill="#D7F5C9">one JSON object, exit 0</text>
  <text class="mono" x="822" y="490" font-size="20" fill="#D7F5C9">catalyst eval ·</text>
  <text class="mono" x="822" y="520" font-size="20" fill="#D7F5C9">the terminal flow</text>
  <text class="sans" x="822" y="618" font-size="26" fill="#F2F7F0" font-weight="700">Go module · base R</text>
  <text class="mono" x="822" y="652" font-size="20" fill="#D7F5C9">fixtures, tolerance, report</text>
  <text class="mono" x="822" y="682" font-size="20" fill="#D7F5C9">runs with no</text>
  <text class="mono" x="822" y="712" font-size="20" fill="#D7F5C9">Catalyst present</text>
  <text class="sans" x="822" y="810" font-size="26" fill="#F2F7F0" font-weight="700">derivative artifact</text>
  <text class="mono" x="822" y="844" font-size="20" fill="#D7F5C9">SHA-256 chain, provenance</text>
  <text class="mono" x="822" y="874" font-size="20" fill="#D7F5C9">re-executable,</text>
  <text class="mono" x="822" y="904" font-size="20" fill="#D7F5C9">tamper-evident</text>
  <path d="M590 766 V844" fill="none" stroke="#F5C453" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#wf-arrow-amber)"/>
  <text class="mono" x="590" y="886" font-size="20" fill="#F5C453" text-anchor="middle">disagrees:</text>
  <text class="mono" x="590" y="916" font-size="20" fill="#F5C453" text-anchor="middle">catalyst.derivative_disagrees</text>
  <text class="mono" x="590" y="946" font-size="20" fill="#F5C453" text-anchor="middle">both numbers shown,</text>
  <text class="mono" x="590" y="976" font-size="20" fill="#F5C453" text-anchor="middle">nothing written</text>
</svg>
