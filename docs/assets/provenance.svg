<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="pv-title pv-desc">
  <title id="pv-title">The digest chain of a derivative artifact</title>
  <desc id="pv-desc">Five linked cards: the source file, the LLVM module, the primal in Catalyst's IR, the derivative in Catalyst's IR, and the validation fixtures. Each carries the first characters of its SHA-256 digest as recorded in derivative.json. A note says that running the artifact again re-derives every digest first, and that one changed byte is refused as catalyst.artifact_tampered.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <g id="pv-link">
      <rect x="-14" y="-7" width="18" height="14" rx="7" fill="none" stroke="#D7F5C9" stroke-width="2"/>
      <rect x="-4" y="-7" width="18" height="14" rx="7" fill="none" stroke="#D7F5C9" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="740" rx="18" fill="#136207"/>
  <g>
    <rect x="30" y="32" width="330" height="204" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
    <text class="sans" x="52" y="70" font-size="26" fill="#F2F7F0" font-weight="700">heat.rs</text>
    <text class="mono" x="52" y="108" font-size="20" fill="#A8C6A0">source_digest</text>
    <text class="mono" x="52" y="142" font-size="20" fill="#D7F5C9">46bf908e3b31…</text>
    <text class="mono" x="52" y="182" font-size="20" fill="#A8C6A0">read only to be digested</text>
  </g>
  <g>
    <rect x="435" y="32" width="330" height="204" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
    <text class="sans" x="457" y="70" font-size="26" fill="#F2F7F0" font-weight="700">module.ll</text>
    <text class="mono" x="457" y="108" font-size="20" fill="#A8C6A0">compiler_ir_digest</text>
    <text class="mono" x="457" y="142" font-size="20" fill="#D7F5C9">2deb1a5f3d99…</text>
    <text class="mono" x="457" y="182" font-size="20" fill="#A8C6A0">your compiler's IR,</text>
    <text class="mono" x="457" y="210" font-size="20" fill="#A8C6A0">byte for byte</text>
  </g>
  <g>
    <rect x="840" y="32" width="330" height="204" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
    <text class="sans" x="862" y="70" font-size="26" fill="#F2F7F0" font-weight="700">primal.cir</text>
    <text class="mono" x="862" y="108" font-size="20" fill="#A8C6A0">primal_ir_digest</text>
    <text class="mono" x="862" y="142" font-size="20" fill="#D7F5C9">d4e502de69d1…</text>
    <text class="mono" x="862" y="182" font-size="20" fill="#A8C6A0">lowered and optimised</text>
  </g>
  <g>
    <rect x="435" y="300" width="330" height="204" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
    <text class="sans" x="457" y="338" font-size="26" fill="#F2F7F0" font-weight="700">derivative.cir</text>
    <text class="mono" x="457" y="376" font-size="20" fill="#A8C6A0">derivative_digest</text>
    <text class="mono" x="457" y="410" font-size="20" fill="#D7F5C9">ca9297cfb5b3…</text>
    <text class="mono" x="457" y="450" font-size="20" fill="#A8C6A0">mode and rules recorded</text>
  </g>
  <g>
    <rect x="30" y="300" width="330" height="204" rx="12" fill="#0B4A04" stroke="#A8C6A0" stroke-width="1.5"/>
    <text class="sans" x="52" y="338" font-size="26" fill="#F2F7F0" font-weight="700">fixtures.json</text>
    <text class="mono" x="52" y="376" font-size="20" fill="#A8C6A0">validation_digest</text>
    <text class="mono" x="52" y="410" font-size="20" fill="#D7F5C9">be3acec24e97…</text>
    <text class="mono" x="52" y="450" font-size="20" fill="#A8C6A0">both gradients,</text>
    <text class="mono" x="52" y="478" font-size="20" fill="#A8C6A0">every point</text>
  </g>
  <use href="#pv-link" x="397" y="134"/>
  <use href="#pv-link" x="802" y="134"/>
  <use href="#pv-link" x="397" y="402"/>
  <path d="M1005 236 V268 H600 V300" fill="none" stroke="#D7F5C9" stroke-width="2"/>
  <text class="mono" x="30" y="560" font-size="22" fill="#F2F7F0">derivative.json records every digest, the compiler and target the module names,</text>
  <text class="mono" x="30" y="592" font-size="22" fill="#F2F7F0">the crate version, the mode and the rules applied.</text>
  <text class="mono" x="30" y="642" font-size="22" fill="#F5C453">differentiate run re-derives the chain before it evaluates;</text>
  <text class="mono" x="30" y="674" font-size="22" fill="#F5C453">one changed byte is catalyst.artifact_tampered,</text>
  <text class="mono" x="30" y="706" font-size="22" fill="#F5C453">naming which digest, and nothing runs.</text>
</svg>
